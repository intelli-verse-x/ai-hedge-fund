name: Reviewed upstream sync quality

on:
  pull_request:
    branches: [main]
  push:
    branches: [main, sync/upstream-main-2026-11-12]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sync-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    name: Offline tests (${{ matrix.os }}, Python 3.11)
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 35
    env:
      FINANCIAL_DATASETS_API_KEY: ''
      X402_WALLET_PRIVATE_KEY: ''
      ANTHROPIC_API_KEY: ''
      OPENAI_API_KEY: ''
      XAI_API_KEY: ''
      DEEPSEEK_API_KEY: ''
      GOOGLE_API_KEY: ''
      KIMI_API_KEY: ''
      MOONSHOT_API_KEY: ''
      TYPESAFE_API_KEY: ''
      HEDGE_FUND_LLM_MODEL: ''
      PYTHONDONTWRITEBYTECODE: '1'
      POETRY_VIRTUALENVS_IN_PROJECT: 'true'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependency tooling
        run: python -m pip install poetry==2.2.1
      - name: Validate lock and install dependencies
        run: |
          poetry check --lock
          poetry install --with dev --extras x402 --no-interaction
          poetry run python -m pip install pytest-socket==0.7.0
      - name: Test without provider credentials or external sockets
        # Loopback/Unix sockets support local event loops; no Internet hosts
        # are allowed during tests. Live data smoke tests remain skipped.
        # Explicitly disable dotenv before test/conftest imports; pinned
        # python-dotenv 1.0 predates PYTHON_DOTENV_DISABLED support.
        run: >-
          poetry run python -c "import dotenv; dotenv.load_dotenv = lambda *a, **kw: False; import pytest; raise SystemExit(pytest.main(['hedge_fund/', '--disable-socket', '--allow-unix-socket', '--allow-hosts=127.0.0.1,::1', '--junitxml=sync-test-results.xml']))"
      - name: Build distribution
        run: poetry build
